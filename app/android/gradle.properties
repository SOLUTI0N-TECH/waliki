# Modest memory: the template default (-Xmx8G plus 4G metaspace) starves this
# machine and the build gets killed. Single-worker, non-parallel execution also
# avoids the jni/.cxx file-lock race that shared pub-cache builds hit on Windows.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
# The Kotlin daemon keeps handles open on its incremental cache, which
# collides with real-time antivirus scanning on Windows.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
